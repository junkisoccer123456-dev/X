id: three_tier
name: 3段階格付け→本命公開型
parts: [本文, リプ1, リプ2]
description: |
  本文で「ダメ→普通」の2段階を見せ、最上位（本命）だけを伏せてリプに引っ張る。リプ1で本命と3段階の要約、リプ2で成功者の共通行動を示す。
rules:
  - 本文: フック1〜2文＋「↓」→ 下位ラベル＋「・」3項目 → 中位ラベル＋「・」3項目 → 「〇〇な会社は…」で締める。
  - リプ1: 上位ラベル＋「・」3項目 → 「つまり、」で3段階を各1行で要約 → 「〇〇した人は…」で締める。
  - リプ2: リプ1の締めを受けて、成功者が見ていたポイントと、面接で使える具体的な質問を提示。
example:
  - kind: 本文
    text: |
      年収が上がるかどうかは、評価制度で決まります↓

      上がらない会社
      ・評価基準が口頭でしか説明されない
      ・評価者が誰か曖昧
      ・昇給のタイミングが不定期

      そこそこの会社
      ・評価シートはある
      ・年1回の評価
      ・昇給幅は上司の裁量が大きい

      上がる会社は…
  - kind: リプ1
    text: |
      上がる会社
      ・等級ごとの期待役割が文書化されている
      ・評価は年2回以上
      ・昇給の実績レンジを面接で答えられる

      つまり、
      上がらない会社は「人が決める」
      そこそこの会社は「制度はあるが運用が粗い」
      上がる会社は「基準が公開されていて回数も多い」

      年収を上げた人が見ていたのは…
  - kind: リプ2
    text: |
      提示額ではなく、次に上がるまでの距離でした。

      入社時に30万低くても、評価が年2回あって基準が明確な会社のほうが、2年後には逆転していることがあります。

      面接で聞くなら「等級が1つ上がると、何ができる人ですか」が効きます。
