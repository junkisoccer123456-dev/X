id: ng_ok
name: NG連打→OK提示型
parts: [本文, リプ1, リプ2]
description: |
  本文でNG回答を3連打して「自分もやってる」と思わせ、リプ1でOK回答、リプ2で面接官が見ている4つのポイントを解説する。
rules:
  - 本文: 1行目で逆説的なフック。「お見送りの人」＋「」付きのNG回答を3つ。NGの共通点を1〜2文でまとめ、「では、〇〇な人はどう答えるか..」で締める。
  - リプ1: 「内定とる人（〇〇ベース）」「通る人（〇〇）」のようにラベル付きでOK回答を3つ。最後は「じつは、〇〇で見られているのは〇〇じゃないです...」で締める。
  - リプ2: 「【 〇〇で見られている4つ 】」の見出し＋①〜④。各項目は見出し1行＋理由1〜2文。最後の項目は「〜かと。」で締める。
example:
  - kind: 本文
    text: |
      逆質問、ここで落ちる人が本当に多いです。

      お見送りの人
      「特にありません」
      お見送りの人
      「御社の事業内容を教えてください」
      お見送りの人
      「残業はどれくらいありますか（それだけ）」

      聞かないのも、調べれば分かることも、条件だけも痛いです。
      では、評価が上がる人は何を聞くか..
  - kind: リプ1
    text: |
      評価が上がる人（役割の確認）
      「入社直後に担当するのは、どの顧客層になりそうですか」

      評価が上がる人（体制の確認）
      「ISとFSの連携は、どのタイミングで情報を渡す設計ですか」

      評価が上がる人（事業の確認）
      「今いちばん伸ばしたいプロダクトはどれですか」

      じつは、逆質問で見られているのは質問の中身だけじゃないです...
  - kind: リプ2
    text: |
      【 逆質問で見られている4つ 】

      ①どこまで調べたか
      調べれば分かることを聞いた時点で、準備していないと判断されます。

      ②働いている自分を想像できているか
      「入社後」を前提にした質問は、それだけで志望度が伝わります。

      ③相手の立場を読めるか
      現場に組織戦略を聞いても答えられません。誰と話しているかで質問を変える人は、仕事でも同じ動きができます。

      ④条件を聞けるか
      条件を聞くのは失礼ではないです。ただ、仕事の質問と混ぜてください。
