id: symptom_prescription
name: 症状連打→一言処方型
parts: [本文]
description: |
  1投稿完結。「症状→処方」を6行連打し、同じ処方語をリフレインさせてリズムを作る。最後に2〜3文で本質を突く。
rules:
  - 冒頭の前置きなしで「〇〇→処方」を6行。処方語（→の後）は6行とも同一。
  - 空行の後、「〇〇なのは、〜じゃないです」系の本質を1〜2文。
  - 最後に行動を促す一言（「〜のほうが早いです」「〜かと」）。
example:
  - kind: 本文
    text: |
      案件名だけ並んでる→書き方を直せ
      主語がチーム→書き方を直せ
      「等」が多い→書き方を直せ
      直近1年が3行→書き方を直せ
      数字がひとつもない→書き方を直せ
      10社出して全落ち→書き方を直せ

      書類が通らないのは、経歴が弱いからじゃないです。読む側が判断できる情報が入ってないだけ。

      応募数を増やす前に、1回直したほうが早いです。
