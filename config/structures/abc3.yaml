id: abc3
name: ABC3パターン
parts: [パターンA, パターンB, パターンC]
description: |
  1テーマにつき切り口の違う3本の単発投稿を作る（A/Bテスト用）。3本は独立して投稿できること。
rules:
  - パターンA（ノウハウ型）: 権威性 or 結論のフック → ①②③ or 「・」の3項目 → 一言の示唆。
  - パターンB（共感・誤解解き型）: 読者の悩み・思い込みを代弁 → 「〜じゃないです」で誤解を解く → 構造的な理由 → 前向きな一言。
  - パターンC（体験談型）: 発信者自身の経歴（persona）に基づく体験 → 今の立場からの気づき → 一言。personaにない経歴は創作しない。
  - 各パターンとも3〜6文程度の短文。
example:
  - kind: パターンA
    text: |
      SaaS企業に出す職務経歴書は、この3つを入れてください。

      ①担当した顧客の規模
      ②自分が決めたこと
      ③変えた結果

      商材が違っても、この3つがあれば読み替えができます。資格を足すより先にここかと。
  - kind: パターンB
    text: |
      書類が通らない人、書くことがないんじゃないです。

      書き方が業務日誌になってるだけなんですよね。やった作業ではなく、自分が判断した場面を書く。それだけで読む側の見え方が変わります。
  - kind: パターンC
    text: |
      支援する側にいた頃、経歴はそのままで書き方だけ直して通った人を何人も見ました。

      今は読む側ですが、正直、中身より先に「読み取れるかどうか」で止まってます。

      もったいない書類、ほんとに多いです。
