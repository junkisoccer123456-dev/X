[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xpost"
version = "0.1.0"
description = "X投稿生成システム: アカウント×構文から投稿案を一括生成し、管理シート形式で出力する"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.8,<2",
    "PyYAML>=6",
]

[project.optional-dependencies]
sheets = ["gspread>=6"]
dev = ["pytest>=8"]

[project.scripts]
xpost = "xpost.cli:main"

[tool.setuptools.packages.find]
include = ["xpost*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
